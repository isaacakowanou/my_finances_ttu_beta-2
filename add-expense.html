<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Add Expense - MyFinances TTU</title>
    <link rel="stylesheet" href="css/styles.css">
</head>
<body>
    <header>
        <h2>MyFinances <span>TTU</span></h2>
        <nav>
            <a href="index.html">Home</a>
<a href="signup.html">Sign Up</a>
<a href="dashboard.html">Dashboard</a>
<a href="budgets.html">Budgets</a>
<a href="goals.html">Goals</a>
        </nav>
    </header>
    <main>
        <h1>Add Expense</h1>
<section class="card"><form action="budgets.html">
    <label for="description">Description</label><input id="description" type="text" required>
    <label for="amount">Amount ($)</label><input id="amount" type="number" min="0" step="0.01" required>
    <label for="date">Date</label><input id="date" type="date" required>
    <label for="category">Category</label>
    <select id="category"><option>Food</option><option>Housing</option><option>Books</option><option>Transportation</option><option>Other</option></select>
    <label for="notes">Notes</label><textarea id="notes" rows="3"></textarea>
    <button type="submit">Submit</button>
</form><p><a href="budgets.html">Cancel</a></p></section>
    </main>
    <footer><p>MyFinances TTU</p></footer>
</body>
</html>
